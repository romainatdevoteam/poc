name: Test Runner Privé

on:
  workflow_dispatch:

jobs:
  test-basic:
    name: "Test Basique"
    runs-on: [self-hosted]
    
    steps:
      - name: Afficher les infos système
        run: |
          echo "Runner privé fonctionne !"
          whoami
          pwd
          uname -a
          df -h
          free -h